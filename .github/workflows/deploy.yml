name: Deploy

# Branch-per-environment: every push to `main` builds fresh images from that
# commit and deploys them straight to the production ECS services. This
# mirrors `deploy-uat.yml` (triggered on pushes to `uat`) structurally — same
# Docker build, ECR push, migration-then-deploy sequencing, and ECS/Fargate
# specifics — just pointed at the production cluster/service names and the
# `Production` GitHub Environment.
#
# There is no separate "promote by SHA" workflow anymore: `main` builds and
# deploys its own tip directly, same as `uat` does for itself. A pending PR
# review gate on both `main` and `uat` branch protection is what stands in for
# the deliberate-promotion step that a manual workflow_dispatch used to
# provide.
#
# NOTE: as of this workflow's introduction, this repository has NO live AWS
# infrastructure. Every `${{ vars.* }}` reference below is a repository
# Variable that does not exist yet, and `secrets.AWS_ROLE_ARN` does not exist
# in the `Production` GitHub Environment either. This workflow WILL fail until:
#   1. `infra/environments/production` (Terraform) is written and applied, and
#   2. the repository Variables and the `Production` environment secret
#      referenced below are created with real values from that Terraform's
#      outputs.
# See the PR description for the exact list.
#
# Infrastructure for this environment is defined in Terraform
# (infra/environments/production); the cluster/service/task-family names
# below are stable outputs of that code, not secrets, once it exists.
#
# The job-level `environment: Production` declarations are load-bearing
# rather than cosmetic: the AWS OIDC role's trust policy is expected to accept
# only `environment:Production` (or `environment:UAT`, for the sibling
# workflow) in the token subject, so a job that assumes AWS credentials MUST
# declare one of them, and `AWS_ROLE_ARN` has to be readable from whichever
# environment the job declares.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # One production deploy at a time; a second push should not race the first.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC role assumption

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.PROJECT_SLUG }}-web
  ECR_REPOSITORY_MCP: ${{ vars.PROJECT_SLUG }}-mcp

  # Production ECS identifiers. Left unsuffixed (no `_PROD`) since production
  # is the canonical/default environment; the UAT counterparts in
  # deploy-uat.yml are the ones suffixed `_UAT`.
  PROD_CLUSTER: ${{ vars.ECS_CLUSTER }}
  PROD_WEB_SERVICE: ${{ vars.ECS_SERVICE_WEB }}
  PROD_MCP_SERVICE: ${{ vars.ECS_SERVICE_MCP }}
  PROD_URL: https://${{ vars.PRIMARY_DOMAIN }}

jobs:
  # ---------------------------------------------------------------- 1. build
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push (web)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (mcp)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_MCP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------- 2. deploy prod
  deploy-production:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Render both revisions first, then migrate before deploying either one.
      # MCP reads Prisma-backed models too, so it must not start schema-dependent
      # code against the previous schema.
      - name: Download current production mcp task definition
        run: |
          aws ecs describe-task-definition --task-definition "$PROD_MCP_SERVICE" \
            --query taskDefinition > mcp-task-definition.json

      - name: Render new image into production mcp task definition
        id: render-mcp-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: mcp-task-definition.json
          container-name: mcp
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_REPOSITORY_MCP }}:${{ github.sha }}

      # web needs its migration to run once, before the new tasks start, and to
      # fail the deploy if it fails. That requires the new revision to be
      # *registered* before the migration runs, so the migration task and the
      # service update reference the identical revision — hence a plain
      # register-task-definition call rather than the deploy action, which
      # registers and updates in one step with no room in between.
      - name: Download current production web task definition
        run: |
          aws ecs describe-task-definition --task-definition "$PROD_WEB_SERVICE" \
            --query taskDefinition > web-task-definition.json

      - name: Render new image into production web task definition
        id: render-web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-definition.json
          container-name: web
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register new production web task definition revision
        id: register-web-task-def
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-web-task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Run production migrations (one-off ECS task, blocks on failure)
        run: |
          set -euo pipefail
          # Same network configuration as the running web service — see
          # deploy-uat.yml.
          NETWORK_CONFIG=$(aws ecs describe-services --cluster "$PROD_CLUSTER" --services "$PROD_WEB_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$PROD_CLUSTER" \
            --task-definition "${{ steps.register-web-task-def.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"web","command":["node_modules/.bin/prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$PROD_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$PROD_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "!! Migration task failed (exit $EXIT_CODE) — aborting deploy, web service is untouched." >&2
            aws ecs describe-tasks --cluster "$PROD_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].{StopCode:stopCode,StoppedReason:stoppedReason}'
            exit 1
          fi
          echo "Migrations applied cleanly."

      - name: Deploy production mcp
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-mcp-task-def.outputs.task-definition }}
          service: ${{ env.PROD_MCP_SERVICE }}
          cluster: ${{ env.PROD_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy production web
        run: |
          aws ecs update-service --cluster "$PROD_CLUSTER" --service "$PROD_WEB_SERVICE" \
            --task-definition "${{ steps.register-web-task-def.outputs.arn }}"
          aws ecs wait services-stable --cluster "$PROD_CLUSTER" --services "$PROD_WEB_SERVICE"

      # Verifies the deploy that just happened, rather than trusting that
      # "services stable" means "the app works".
      - name: Smoke test production
        run: ./scripts/smoke-test.sh "$PROD_URL"
